<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Мой бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f6f2fb; --card: #ffffff; --text: #2b1d3a; --hint: #8c7f9c; --track: #e9e4ef;
    --g1: #ff3db4; --g2: #6b2dff; --bad1: #ff6a8e; --bad2: #e0245e; --shadow: 0 6px 24px rgba(120, 60, 170, .10);
    --hero: linear-gradient(135deg, #ffe3f5 0%, #efe2ff 45%, #dcf7f4 100%);
  }
  :root.dark {
    --bg: #17111f; --card: #231a2e; --text: #f3ecfa; --hint: #a597b5; --track: #3a2f48;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    --hero: linear-gradient(135deg, #3a1f45 0%, #2b2350 50%, #1d3a3d 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif; }
  main { padding: 16px 16px 100px; max-width: 520px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 22px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .hero { background: var(--hero); }
  .hint { color: var(--hint); font-size: 13px; }
  .ico { width: 44px; height: 44px; flex: none; }
  .ico.sm { width: 26px; height: 26px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .head h3 { margin: 0; font-size: 17px; }
  .big { font-size: 40px; font-weight: 800; letter-spacing: -1px; margin: 2px 0 2px;
    background: linear-gradient(90deg, var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .big.bad { background: linear-gradient(90deg, var(--bad1), var(--bad2)); -webkit-background-clip: text; background-clip: text; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

  /* шкала-пилюля */
  .pbar { position: relative; height: 34px; border-radius: 17px; background: var(--track); margin: 14px 4px 6px 0; }
  .pbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 17px; min-width: 34px;
    background: linear-gradient(90deg, var(--g1), var(--g2)); }
  .pbar.over .fill { background: linear-gradient(90deg, var(--bad1), var(--bad2)); }
  .pbar .pct { position: absolute; top: 50%; transform: translateY(-50%); font-size: 16px; font-weight: 300; color: #fff; white-space: nowrap; }
  .pbar .pct.out { color: var(--hint); font-weight: 500; }
  .pbar .knob { position: absolute; top: 50%; width: 42px; height: 42px; margin-top: -21px; border-radius: 50%;
    background: #fff; box-shadow: 0 4px 10px rgba(60, 20, 90, .28); }
  .pbar.sm { height: 24px; border-radius: 12px; margin-top: 10px; }
  .pbar.sm .fill { border-radius: 12px; min-width: 24px; }
  .pbar.sm .knob { width: 30px; height: 30px; margin-top: -15px; }
  .pbar.sm .pct { font-size: 12px; }

  .list > div { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--track); }
  .list > div:last-child { border-bottom: 0; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);
    box-shadow: 0 -4px 20px rgba(120, 60, 170, .10); padding: 6px 6px calc(8px + env(safe-area-inset-bottom)); }
  .tabs button { flex: 1; border: 0; background: none; color: var(--hint); font: inherit; font-size: 12px; padding: 4px 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabs button svg { width: 34px; height: 34px; opacity: .55; transition: transform .15s, opacity .15s; }
  .tabs button.on { color: var(--text); font-weight: 600; }
  .tabs button.on svg { opacity: 1; transform: scale(1.12); }
  .screen { display: none; } .screen.on { display: block; }
  input { width: 100%; border: 1.5px solid var(--track); background: var(--bg); color: var(--text);
    border-radius: 16px; padding: 13px; font: inherit; outline: none; }
  input:focus { border-color: #c79bff; }
  input.amount { font-size: 34px; font-weight: 800; text-align: center; }
  .seg { display: flex; background: var(--bg); border-radius: 16px; padding: 4px; margin-bottom: 14px; }
  .seg button { flex: 1; font-size: 14px !important; padding: 9px 2px !important; border: 0; background: none; color: var(--hint); padding: 9px; border-radius: 12px; font: inherit; }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 2px 8px rgba(120, 60, 170, .15); }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .chips button { border: 1.5px solid transparent; background: var(--bg); color: var(--text); border-radius: 18px;
    padding: 10px 4px 8px; font: inherit; font-size: 12px; line-height: 1.2; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chips button svg { width: 40px; height: 40px; }
  .chips button.on { border-color: #b98aff; background: linear-gradient(135deg, #ffe3f5, #ece0ff 55%, #dcf7f4); color: #2b1d3a; font-weight: 600; }
  .main-btn { width: 100%; border: 0; border-radius: 18px; padding: 16px; font: inherit; font-weight: 700; font-size: 16px;
    background: linear-gradient(90deg, var(--g1), var(--g2)); color: #fff; margin-top: 8px; box-shadow: 0 6px 16px rgba(140, 50, 220, .3); }
  .main-btn:disabled { opacity: .4; box-shadow: none; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 140px; margin-top: 14px; position: relative; }
  .chart .col { flex: 1; background: linear-gradient(180deg, var(--g1), var(--g2)); opacity: .8; border-radius: 4px 4px 1px 1px; min-height: 3px; }
  .chart .col.today { opacity: 1; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #c79bff; }
  .chart .col.over { background: linear-gradient(180deg, var(--bad1), var(--bad2)); }
  .chart .col.zero { opacity: .15; }
  .chart .line { position: absolute; left: 0; right: 0; border-top: 2px dashed #b98aff; }
  .axis { display: flex; justify-content: space-between; color: var(--hint); font-size: 11px; margin-top: 4px; }
  .cat { padding: 12px 0; border-bottom: 1px solid var(--track); }
  .cat:last-child { border-bottom: 0; }
  .cat .name { display: flex; align-items: center; gap: 10px; }
  .delta { font-size: 12px; color: var(--hint); }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #2b1d3a; color: #fff;
    padding: 12px 16px; border-radius: 16px; font-size: 14px; display: none; gap: 12px; align-items: center; z-index: 5; max-width: 92%;
    box-shadow: 0 8px 24px rgba(43, 29, 58, .35); }
  .toast button { background: none; border: 0; color: #ff9ad8; font: inherit; font-weight: 700; }
  .center { text-align: center; padding: 50px 10px; }
  .recent > div { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--track); }
  .recent > div:last-child { border-bottom: 0; }
  .recent .l { display: flex; align-items: center; gap: 8px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .duo .card { margin: 0; padding: 14px; }
  .mini-num { font-size: 22px; font-weight: 800; margin-top: 2px; }
  .sched > div { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--track); }
  .sched > div:last-child { border-bottom: 0; }
  .sched .date { width: 54px; flex: none; text-align: center; border-radius: 12px; padding: 5px 0; background: var(--bg); font-size: 12px; line-height: 1.15; }
  .sched .date b { display: block; font-size: 17px; }
  .sched .what { flex: 1; } .sched .what small { display: block; color: var(--hint); font-size: 12px; }
  .sched .pay { color: #1f9d6b; } :root.dark .sched .pay { color: #6fe0b0; }
  .sched .soon .date { background: linear-gradient(135deg, #ffe3f5, #ece0ff); color: #2b1d3a; }
</style>
</head>

 56 14 53 Z" fill="url(#sheen)"/><rect x="28.5" y="22" width="7" height="34" fill="#fff" opacity=".55"/><path d="M32 22 C22 22 17 12 23 10 C28 8.5 31 16 32 22 C33 16 36 8.5 41 10 C47 12 42 22 32 22 Z" fill="url(#ir)" stroke="#fff" stroke-opacity=".7"/></g></symbol><symbol id="i-heart" viewBox="0 0 64 64"><g filter="url(#ds)"><path d="M32 54 C14 42 7.5 32 7.5 23 C7.5 15 13.5 10 20.5 10 C25.5 10 29.5 13 32 17 C34.5 13 38.5 10 43.5 10 C50.5 10 56.5 15 56.5 23 C56.5 32 50 42 32 54 Z" transform="translate(1.6 2.6)" fill="url(#ir2)"/><path d="M32 54 C14 42 7.5 32 7.5 23 C7.5 15 13.5 10 20.5 10 C25.5 10 29.5 13 32 17 C34.5 13 38.5 10 43.5 10 C50.5 10 56.5 15 56.5 23 C56.5 32 50 42 32 54 Z" fill="url(#ir)" stroke="#fff" stroke-opacity=".75" stroke-width="1.1"/><path d="M32 54 C14 42 7.5 32 7.5 23 C7.5 15 13.5 10 20.5 10 C25.5 10 29.5 13 32 17 C34.5 13 38.5 10 43.5 10 C50.5 10 56.5 15 56.5 23 C56.5 32 50 42 32 54 Z" fill="url(#sheen)"/><path d="M32 24 V38 M25 31 H39" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/></g></symbol><symbol id="i-star" viewBox="0 0 64 64"><g filter="url(#ds)"><path d="M32.0 8.0 L38.5 24.1 L55.8 25.3 L42.5 36.4 L46.7 53.2 L32.0 44.0 L17.3 53.2 L21.5 36.4 L8.2 25.3 L25.5 24.1 Z" transform="translate(1.6 2.6)" fill="url(#ir2)"/><path d="M32.0 8.0 L38.5 24.1 L55.8 25.3 L42.5 36.4 L46.7 53.2 L32.0 44.0 L17.3 53.2 L21.5 36.4 L8.2 25.3 L25.5 24.1 Z" fill="url(#ir)" stroke="#fff" stroke-opacity=".75" stroke-width="1.1"/><path d="M32.0 8.0 L38.5 24.1 L55.8 25.3 L42.5 36.4 L46.7 53.2 L32.0 44.0 L17.3 53.2 L21.5 36.4 L8.2 25.3 L25.5 24.1 Z" fill="url(#sheen)"/></g></symbol><symbol id="i-wifi" viewBox="0 0 64 64"><g filter="url(#ds)" fill="none" stroke-linecap="round"><path d="M9 27 A33 33 0 0 1 55 27" transform="translate(1.4 2.4)" stroke="url(#ir2)" stroke-width="7"/><path d="M17 36 A21 21 0 0 1 47 36" transform="translate(1.4 2.4)" stroke="url(#ir2)" stroke-width="7"/><path d="M25 44.5 A10 10 0 0 1 39 44.5" transform="translate(1.4 2.4)" stroke="url(#ir2)" stroke-width="7"/><path d="M9 27 A33 33 0 0 1 55 27" stroke="url(#ir)" stroke-width="7"/><path d="M17 36 A21 21 0 0 1 47 36" stroke="url(#ir)" stroke-width="7"/><path d="M25 44.5 A10 10 0 0 1 39 44.5" stroke="url(#ir)" stroke-width="7"/><path d="M9 27 A33 33 0 0 1 55 27" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><path d="M17 36 A21 21 0 0 1 47 36" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><path d="M25 44.5 A10 10 0 0 1 39 44.5" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><circle cx="33.4" cy="54.4" r="5" fill="url(#ir2)"/><circle cx="32" cy="53" r="5" fill="url(#ir)" stroke="#fff" stroke-opacity=".75"/></g></symbol></defs></svg>
<main>
  <div id="loading" class="center hint">Загружаю бюджет…</div>
  <div id="error" class="center" style="display:none"></div>

  <section id="s-home" class="screen">
    <div class="card hero">
      <div class="head"><svg class="ico"><use href="#i-clock"/></svg><div class="hint" id="h-until" style="font-size:14px"></div></div>
      <div class="big" id="h-left"></div>
      <div class="hint" id="h-perday"></div>
      <div class="hint" id="h-real" style="margin-top:4px"></div>
      <div id="h-bar"></div>
      <div class="row hint"><span id="h-spent"></span><span id="h-budget"></span></div>
    </div>
    <div class="duo">
      <div class="card"><div class="hint">Потрачено сегодня</div><div class="mini-num" id="t-spent"></div><div id="t-bar"></div><div class="hint" id="t-norm"></div></div>
      <div class="card"><div class="hint">Зарплата</div><div class="mini-num" id="t-pay"></div><div class="hint" id="t-paydays"></div></div>
    </div>
    <div class="card" id="c-lock">
      <div class="head"><svg class="ico"><use href="#i-shield"/></svg><h3>Не трогать</h3></div>
      <div class="list" id="h-lock"></div>
    </div>
    <div class="card">
      <div class="head"><svg class="ico"><use href="#i-clock"/></svg><h3>Платежи на месяц вперёд</h3></div>
      <div class="sched" id="sched"></div>
    </div>
    <div class="card">
      <div class="head"><svg class="ico"><use href="#i-pig"/></svg><h3>Подушка</h3></div>
      <div id="p-per"><div class="row"><span>В этом периоде</span><b id="p-period"></b></div>
      <div id="p-bar1"></div></div>
      <div class="row" style="margin-top:14px"><span>Всего накоплено</span><b id="p-total"></b></div>
      <div id="p-bar2"></div>
    </div>
  </section>

  <section id="s-add" class="screen">
    <div class="card">
      <div class="seg" id="type">
        <button data-t="Расход" class="on">Трата</button>
        <button data-t="Отложила">В подушку</button>
        <button data-t="Доход">Доход</button>
        <button data-t="Баланс">Баланс</button>
      </div>
      <input id="amount" class="amount" inputmode="decimal" placeholder="0 ₽" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="hint" id="bal-hint" style="display:none;margin:12px 2px;text-align:center">Сколько сейчас денег на всех картах и счетах, кроме подушки</div>
      <input id="comment" placeholder="Комментарий (необязательно)">
      <button class="main-btn" id="save" disabled>Записать</button>
    </div>
    <div class="card">
      <div class="head"><svg class="ico sm"><use href="#i-clock"/></svg><h3>Последние записи</h3></div>
      <div class="recent" id="recent"></div>
    </div>
  </section>

  <section id="s-cats" class="screen">
    <div class="card">
      <div class="head"><svg class="ico"><use href="#i-chart"/></svg><h3>Траты по дням</h3></div>
      <div class="hint" id="d-legend"></div>
      <div class="chart" id="chart"></div>
      <div class="axis" id="axis"></div>
    </div>
    <div class="card">
      <div class="head"><svg class="ico"><use href="#i-star"/></svg><h3 id="cats-title">Категории</h3></div>
      <div id="cats"></div>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-s="home" class="on"><svg><use href="#i-home"/></svg>Главная</button>
  <button data-s="add"><svg><use href="#i-plus"/></svg>Добавить</button>
  <button data-s="cats"><svg><use href="#i-chart"/></svg>Категории</button>
</nav>
<div class="toast" id="toast"><span id="toast-text"></span><button id="toast-undo">Отменить</button></div>

<script>
var INIT = '', DATA = null, TYPE = 'Расход', CAT = '';

function rub(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('ru-RU') + ' ₽'; }
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pct(a, b) { return b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0; }
function catIcon(name) {
  var n = String(name).toLowerCase();
  var map = [['продукт','bag'],['кафе','glass'],['ресторан','glass'],['одежд','tag'],['маркет','tag'],['красот','gem'],
             ['такси','car'],['транспорт','car'],['дом','gift'],['подар','gift'],['здоров','heart'],['аптек','heart'],
             ['связь','wifi'],['подписк','wifi'],['подушк','pig'],['доход','plus']];
  for (var i = 0; i < map.length; i++) if (n.indexOf(map[i][0]) >= 0) return map[i][1];
  return 'star';
}
function plural(n, a, b, c) { n = Math.abs(n) % 100; var n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }
function icon(name, cls) { return '<svg class="' + (cls || 'ico sm') + '"><use href="#i-' + name + '"/></svg>'; }
// шкала в стиле «пилюля с ползунком»
function pbar(value, total, small, nolabel) {
  var r = total > 0 ? value / total : 0, p = Math.max(0, Math.min(100, r * 100)), label = Math.round(r * 100) + '%';
  var knob = small ? 30 : 42;
  var html = '<div class="pbar' + (small ? ' sm' : '') + (r > 1 ? ' over' : '') + '">' +
    '<div class="fill" style="width:' + p + '%"></div>';
  var knobLeft = 'calc(' + p + '% - ' + (knob / 2) + 'px)';
  if (p < 100) knobLeft = 'max(-4px, min(' + knobLeft + ', calc(100% - ' + (knob - 4) + 'px)))';
  else knobLeft = 'calc(100% - ' + (knob - 4) + 'px)';
  if (nolabel) {} else if (p >= 24) html += '<span class="pct" style="right:max(calc(' + (100 - p) + '% + ' + (knob / 2 + 8) + 'px), ' + (knob + 6) + 'px)">' + label + '</span>';
  else html += '<span class="pct out" style="left:max(calc(' + p + '% + ' + (knob / 2 + 10) + 'px), ' + (knob + 8) + 'px)">' + label + '</span>';
  return html + '<div class="knob" style="left:' + knobLeft + '"></div></div>';
}

function parseQS(s) {
  var o = {};
  s.replace(/^#/, '').split('&').forEach(function (p) {
    if (!p) return;
    var i = p.indexOf('=');
    var k = i < 0 ? p : p.slice(0, i), v = i < 0 ? '' : p.slice(i + 1);
    try { o[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { o[k] = v; }
  });
  return o;
}

function applyTheme(tp) {
  try {
    var c = (JSON.parse(tp).bg_color || '#ffffff').replace('#', '');
    var lum = (parseInt(c.substr(0, 2), 16) * 299 + parseInt(c.substr(2, 2), 16) * 587 + parseInt(c.substr(4, 2), 16) * 114) / 1000;
    if (lum < 110) document.documentElement.classList.add('dark');
  } catch (e) {}
}
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');

var API_URL = 'https://script.google.com/macros/s/AKfycbxJDkcaf7Z-J3uHBTEtf75s0ejpq4eKEbgBgFI55Ygv0j_zgU5wvcyTBWhj80LKXxMe/exec';   // ссылка на веб-приложение Apps Script (для версии на GitHub Pages)
function call(action, payload, ok) {
  if (window.google && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function (e) { showError((e && e.message) || 'Что-то пошло не так'); })
      .api(INIT, action, payload || null);
    return;
  }
  fetch(API_URL, { method: 'POST', body: JSON.stringify({ type: 'api', initData: INIT, action: action, payload: payload || null }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.error) showError(j.error); else ok(j.data); })
    .catch(function () { showError('Нет связи с таблицей. Попробуйте ещё раз.'); });
}

function showError(msg) {
  el('loading').style.display = 'none';
  el('error').style.display = 'block';
  el('error').textContent = msg;
}

function render(d) {
  DATA = d;
  el('loading').style.display = 'none';
  if (!document.querySelector('.screen.on')) el('s-home').classList.add('on');
  var p = d.period;
  // главная
  el('h-until').textContent = 'До зарплаты ' + p.next + ' можно потратить';
  var main = (p.real !== null && p.real !== undefined) ? p.real : p.canSpend;
  el('h-left').textContent = rub(main);
  el('h-left').className = 'big' + (main < 0 ? ' bad' : '');
  el('h-perday').textContent = main >= 0 ? '≈ ' + rub(main / p.daysLeft) + ' в день · дней до зарплаты: ' + p.daysLeft
                                          : 'Денег до зарплаты не хватает — лучше притормозить';
  el('h-real').textContent = (p.real !== null && p.real !== undefined)
    ? 'по балансу ' + rub(p.balance) + ' от ' + p.balanceAt + ' · по плану ' + rub(p.canSpend)
    : 'Обновите баланс во вкладке «Добавить», чтобы считать по реальным деньгам';
  el('h-bar').innerHTML = pbar(p.spent, p.budget);
  el('h-spent').textContent = 'Потрачено ' + rub(p.spent);
  el('h-budget').textContent = 'из ' + rub(p.budget);
  var lock = p.upcoming.map(function (o) { return '<div><span>' + esc(o.name) + ' · ' + esc(o.date) + '</span><b>' + rub(o.sum) + '</b></div>'; });
  if (p.carry >= 1000) lock.push('<div><span>На платежи после ' + esc(p.next) + '</span><b>' + rub(p.carry) + '</b></div>');
  el('h-lock').innerHTML = lock.join('');
  el('c-lock').style.display = lock.length ? 'block' : 'none';
  var allow = (main + (d.todaySpent || 0)) / p.daysLeft;
  el('t-spent').textContent = rub(d.todaySpent || 0);
  el('t-bar').innerHTML = pbar(d.todaySpent || 0, allow, true, true);
  el('t-norm').textContent = 'норма на сегодня ' + rub(Math.max(0, allow));
  el('t-pay').textContent = p.next;
  el('t-paydays').textContent = 'через ' + p.daysLeft + ' ' + plural(p.daysLeft, 'день', 'дня', 'дней');
  var mon = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  el('sched').innerHTML = (d.schedule || []).map(function (x) {
    var parts = x.date.split(' ');
    var when = x.inDays === 0 ? 'сегодня' : x.inDays === 1 ? 'завтра' : 'через ' + x.inDays + ' ' + plural(x.inDays, 'день', 'дня', 'дней');
    return '<div class="' + (x.inDays <= 3 ? 'soon' : '') + '"><div class="date"><b>' + esc(parts[0]) + '</b>' + esc((parts[1] || '').slice(0, 3)) + '</div>' +
      '<div class="what">' + esc(x.name) + '<small>' + when + '</small></div>' +
      '<b class="' + (x.kind === 'pay' ? 'pay' : '') + '">' + (x.kind === 'pay' ? '+' : '−') + rub(x.sum) + '</b></div>';
  }).join('') || '<span class="hint">Нет платежей</span>';
  el('p-per').style.display = p.goalP > 0 ? 'block' : 'none';
  el('p-period').textContent = rub(p.saved) + ' из ' + rub(p.goalP);
  el('p-bar1').innerHTML = pbar(p.saved, p.goalP, true);
  el('p-total').textContent = rub(d.savings.total) + ' из ' + rub(d.savings.goal);
  el('p-bar2').innerHTML = pbar(d.savings.total, d.savings.goal, true);

  // быстрый ввод
  var chips = d.cats.map(function (c) {
    return '<button data-c="' + esc(c.name) + '"' + (c.name === CAT ? ' class="on"' : '') + '>' + icon(catIcon(c.name), '') + esc(c.name) + '</button>';
  });
  el('chips').innerHTML = chips.join('');
  el('recent').innerHTML = d.recent.length ? d.recent.map(function (x) {
    return '<div><span class="l">' + icon(catIcon(x.cat)) + esc(x.date) + ' · ' + esc(x.cat) + '</span><b>' + (x.type === 'Доход' ? '+' : '') + rub(x.sum) + '</b></div>';
  }).join('') : '<span class="hint">Пока пусто</span>';

  // график по дням
  var days = d.daily, max = Math.max.apply(null, days.concat([d.perDayNorm, 1]));
  el('chart').innerHTML = days.map(function (v, i) {
    var cls = 'col' + (i + 1 === d.todayDay ? ' today' : '') + (v > d.perDayNorm ? ' over' : '') + (v === 0 ? ' zero' : '');
    return '<div class="' + cls + '" style="height:' + (v / max * 100) + '%" title="' + (i + 1) + ': ' + rub(v) + '"></div>';
  }).join('') + '<div class="line" style="bottom:' + (d.perDayNorm / max * 100) + '%"></div>';
  el('axis').innerHTML = '<span>1</span><span>' + Math.ceil(days.length / 2) + '</span><span>' + days.length + '</span>';
  el('d-legend').textContent = d.monthName + ' · пунктир — норма ' + rub(d.perDayNorm) + ' в день';

  // категории
  el('cats-title').textContent = 'Категории · ' + d.monthName;
  el('cats').innerHTML = d.cats.filter(function (c) { return c.limit || c.spent || c.prev; }).map(function (c) {
    var delta = '';
    if (c.prev > 0) delta = '<div class="delta" style="margin-top:6px">прошлый месяц: ' + rub(c.prev) + (c.spent > c.prev ? ' · уже больше' : '') + '</div>';
    return '<div class="cat"><div class="row"><span class="name">' + icon(catIcon(c.name)) + esc(c.name) + '</span><b>' + rub(c.spent) +
      (c.limit ? ' <span class="hint">из ' + rub(c.limit) + '</span>' : '') + '</b></div>' +
      (c.limit ? pbar(c.spent, c.limit, true) : '') + delta + '</div>';
  }).join('');
  updateSave();
}

function updateSave() {
  var a = parseFloat(String(el('amount').value).replace(/\s/g, '').replace(',', '.'));
  el('save').disabled = !(a > 0 || (TYPE === 'Баланс' && a === 0)) || (TYPE === 'Расход' && !CAT);
}

function toast(text) {
  el('toast-text').textContent = text;
  el('toast').style.display = 'flex';
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { el('toast').style.display = 'none'; }, 5000);
}

// события
document.querySelector('.tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.toggle('on', s.id === 's-' + b.dataset.s); });
  if (b.dataset.s === 'add') setTimeout(function () { el('amount').focus(); }, 50);
});
el('type').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  TYPE = b.dataset.t;
  document.querySelectorAll('#type button').forEach(function (x) { x.classList.toggle('on', x === b); });
  el('chips').style.display = TYPE === 'Расход' ? 'grid' : 'none';
  el('bal-hint').style.display = TYPE === 'Баланс' ? 'block' : 'none';
  updateSave();
});
el('chips').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  CAT = b.dataset.c;
  document.querySelectorAll('#chips button').forEach(function (x) { x.classList.toggle('on', x === b); });
  updateSave();
});
el('amount').addEventListener('input', updateSave);
el('save').addEventListener('click', function () {
  var a = parseFloat(String(el('amount').value).replace(/\s/g, '').replace(',', '.'));
  el('save').disabled = true; el('save').textContent = 'Записываю…';
  call('add', { amount: a, type: TYPE, cat: CAT, comment: el('comment').value }, function (d) {
    el('save').textContent = 'Записать';
    el('amount').value = ''; el('comment').value = '';
    render(d);
    var left = (d.period.real !== null && d.period.real !== undefined) ? d.period.real : d.period.canSpend;
    toast((TYPE === 'Баланс' ? 'Баланс обновлён: ' + rub(a) : 'Записано: ' + rub(a) + (TYPE === 'Расход' ? ' · ' + CAT : '')) + '. До зарплаты можно ' + rub(left));
  });
});
el('toast-undo').addEventListener('click', function () {
  el('toast').style.display = 'none';
  call('undo', null, function (d) { render(d); toast('Запись удалена'); el('toast-undo').style.display = 'none';
    setTimeout(function () { el('toast-undo').style.display = ''; }, 5000); });
});

// старт
var TG = window.Telegram && Telegram.WebApp;
if (TG && TG.initData) {
  INIT = TG.initData;
  try { TG.ready(); TG.expand(); if (TG.colorScheme === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
  call('load', null, render);
} else if (window.google && google.script && google.script.url) google.script.url.getLocation(function (loc) {
  var raw = String(loc.hash || '');
  var m = raw.match(/tgWebAppData=(.*?)(?:&tgWebApp|$)/);
  INIT = m ? m[1] : '';
  // если строка ещё закодирована целиком — раскодируем один раз
  if (INIT && INIT.indexOf('hash=') < 0) { try { INIT = decodeURIComponent(INIT); } catch (e) {} }
  var th = raw.match(/tgWebAppThemeParams=([^&]*)/);
  if (th) { try { applyTheme(decodeURIComponent(th[1])); } catch (e) {} }
  if (!INIT) { showError('Откройте приложение кнопкой «Бюджет» в чате с ботом.'); return; }
  call('load', null, render);
});
else showError('Откройте приложение кнопкой «Бюджет» в чате с ботом.');
</script>
</body>
</html>
